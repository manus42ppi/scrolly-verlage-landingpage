"<!DOCTYPE html>\n<html><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<script src=\"aebc2c69-7ea9-4520-ab51-91849c8b42d2\"><\u002Fscript>\n<!-- Cloudflare Web Analytics --><script type='module' src='https:\u002F\u002Fstatic.cloudflareinsights.com\u002Fbeacon.min.js' data-cf-beacon='{\"token\": \"97476983e481409c9a299b270e527632\"}'><\u002Fscript><!-- End Cloudflare Web Analytics -->\n<script src=\"\u002Fjs\u002Flead-capture.js\" defer><\u002Fscript>\n<script src=\"\u002Fjs\u002Fpopup-banner.js\" defer><\u002Fscript>\n<\u002Fhead>\n<body>\n<x-dc>\n\n<helmet>\n<style>\n@font-face { font-family:\"Poppins\"; font-weight:400; font-display:swap; src:url(\"8f411c8e-19bf-4837-b4a8-3dd5863da08d\") format(\"woff2\"); }\n@font-face { font-family:\"Poppins\"; font-style:italic; font-weight:400; font-display:swap; src:url(\"53812ab3-973b-430e-af2c-2e61a97892eb\") format(\"woff2\"); }\n@font-face { font-family:\"Poppins\"; font-weight:500; font-display:swap; src:url(\"46f0cc26-75cd-40d3-9d95-46bc17d2ede5\") format(\"woff2\"); }\n@font-face { font-family:\"Poppins\"; font-weight:600; font-display:swap; src:url(\"ec093db3-b480-41a9-9170-6a8d79facfb8\") format(\"woff2\"); }\n@font-face { font-family:\"Poppins\"; font-weight:700; font-display:swap; src:url(\"6f4a3d12-b0de-4314-94ec-dbded8df9a82\") format(\"woff2\"); }\n:root {\n  --pink:#ff0f6e; --pink-deep:#c9004f;\n  --ink:#100c14; --ink-soft:#1c1620;\n  --paper:#f7f4ef; --paper-2:#efe9e0; --rule:#ddd4c8;\n  --ink-2:#544b53; --ink-3:#8d8288;\n  --cx-font-family:\"Poppins\",\"Helvetica Neue\",Arial,sans-serif;\n  --serif:\"Poppins\",\"Helvetica Neue\",Arial,sans-serif;\n  --cx-font-mono:\"Courier New\",Courier,monospace;\n  --wide:74rem;\n  --cx-radius-md:0.5rem; --cx-radius-lg:0.75rem; --cx-radius-pill:9999px;\n  --cx-space-4:1rem; --cx-space-6:1.5rem; --cx-space-8:2rem; --cx-space-16:4rem; --cx-space-24:6rem;\n  --cx-eyebrow-tracking:0.12em; --cx-transition:150ms ease-out;\n}\n* { box-sizing:border-box; }\nhtml { -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale; scroll-behavior:smooth; }\nbody { margin:0; background:var(--paper); color:var(--ink); font-family:var(--cx-font-family); font-size:1rem; line-height:1.6; }\na { color:var(--pink); text-decoration:none; transition:opacity var(--cx-transition); }\na:hover { opacity:0.75; }\np { text-wrap:pretty; margin:0; }\nh1,h2,h3 { margin:0; text-wrap:balance; }\ninput { font-family:inherit; }\n@keyframes cx-marquee { from { transform:translateX(0) } to { transform:translateX(-50%) } }\n@keyframes cx-pulse { 0%,100% { opacity:1 } 50% { opacity:0.35 } }\n<\u002Fstyle>\n<\u002Fhelmet>\n\n<div style=\"background:var(--paper); overflow-x:hidden;\">\n\n  <div style=\"position:sticky; top:0; z-index:50; background:rgba(247,244,239,0.88); backdrop-filter:blur(10px); border-bottom:1px solid var(--rule);\">\n    <div style=\"max-width:var(--wide); margin:0 auto; padding:14px 24px; display:flex; align-items:center; justify-content:space-between; gap:16px;\">\n      <div style=\"display:flex; align-items:center; gap:10px;\">\n        <span style=\"width:10px; height:10px; border-radius:9999px; background:var(--pink); animation:cx-pulse 2.4s ease-in-out infinite;\"><\u002Fspan>\n        <span style=\"font-size:17px; font-weight:700; letter-spacing:-0.02em;\">Scrolly<\u002Fspan>\n        <span style=\"font-size:10.4px; font-weight:700; letter-spacing:var(--cx-eyebrow-tracking); text-transform:uppercase; color:var(--ink-3); white-space:nowrap;\">für Verlage<\u002Fspan>\n      <\u002Fdiv>\n      <a href=\"#termin\" style=\"background:var(--pink); color:#fff; font-size:13px; font-weight:600; padding:10px 18px; border-radius:var(--cx-radius-pill); white-space:nowrap;\">15-Min-Termin<\u002Fa>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <section style=\"background:var(--ink); color:#fff; position:relative; overflow:hidden;\">\n    <div style=\"position:absolute; inset:0; background:radial-gradient(700px 420px at 82% 8%, rgba(255,15,110,0.28), transparent 70%);\"><\u002Fdiv>\n    <div style=\"position:relative; max-width:var(--wide); margin:0 auto; padding:88px 24px 96px; display:grid; grid-template-columns:repeat(auto-fit,minmax(320px,1fr)); gap:56px 72px; align-items:center;\">\n      <div>\n        <div style=\"display:inline-flex; align-items:center; gap:9px; border:1px solid rgba(255,255,255,0.18); border-radius:var(--cx-radius-pill); padding:7px 14px; font-size:10.4px; font-weight:700; letter-spacing:var(--cx-eyebrow-tracking); text-transform:uppercase; color:rgba(255,255,255,0.72); margin-bottom:28px;\">\n          <span style=\"width:6px; height:6px; border-radius:9999px; background:var(--pink);\"><\u002Fspan>Für Anzeigenleitung im Verlag\n        <\u002Fdiv>\n        <h1 style=\"font-size:clamp(44px,6.6vw,84px); font-weight:700; line-height:0.98; letter-spacing:-0.035em; margin-bottom:26px;\">Neue Erlöse.<br>Ohne neue Köpfe.<\u002Fh1>\n        <p style=\"font-size:19px; line-height:1.55; color:rgba(255,255,255,0.74); max-width:46ch; margin-bottom:34px;\">Ein Werbeformat, das gelesen wird statt weggeklickt. <span style=\"color:#fff; font-weight:600;\">Ihr Verkaufsteam baut es selbst — in 15 Minuten, ohne Redaktion, ohne IT.<\u002Fspan><\u002Fp>\n        <div style=\"display:flex; flex-wrap:wrap; align-items:center; gap:18px;\">\n          <a href=\"#termin\" style=\"display:inline-flex; align-items:center; gap:10px; background:var(--pink); color:#fff; font-size:16px; font-weight:600; padding:17px 30px; border-radius:var(--cx-radius-pill);\" style-hover=\"opacity:0.9\">Termin sichern <span style=\"font-size:18px; line-height:1;\">→<\u002Fspan><\u002Fa>\n          <span style=\"font-size:14px; color:rgba(255,255,255,0.5);\">15 Minuten Gespräch. Rund 3.000 € im Jahr, unbegrenzt viele Scrollys.<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"justify-self:center; width:100%; max-width:400px;\">\n        <div style=\"border:1px solid rgba(255,255,255,0.14); border-radius:20px; background:var(--ink-soft); padding:20px;\">\n          <div style=\"display:flex; gap:7px; margin-bottom:16px;\">\n            <sc-for list=\"{{ steps }}\" as=\"st\" hint-placeholder-count=\"3\">\n              <button type=\"button\" sc-camel-on-click=\"{{ st.pick }}\" style=\"{{ st.tabStyle }}\">{{ st.tab }}<\u002Fbutton>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <div style=\"border-radius:14px; background:#fff; color:var(--ink); overflow:hidden; min-height:322px; display:flex; flex-direction:column;\">\n            <div style=\"height:4px; background:var(--paper-2);\">\n              <div style=\"{{ progressStyle }}\"><\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"padding:22px 22px 24px; flex:1; display:flex; flex-direction:column; gap:14px;\">\n              <div style=\"font-size:10.4px; font-weight:700; letter-spacing:var(--cx-eyebrow-tracking); text-transform:uppercase; color:var(--pink);\">{{ demo.kicker }}<\u002Fdiv>\n              <div style=\"font-weight:600; font-size:24px; line-height:1.15; letter-spacing:-0.03em;\">{{ demo.title }}<\u002Fdiv>\n              <div style=\"display:grid; gap:8px;\">\n                <sc-for list=\"{{ demo.rows }}\" as=\"row\" hint-placeholder-count=\"3\">\n                  <div style=\"{{ row.style }}\">{{ row.text }}<\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n              <div style=\"margin-top:auto; font-size:12px; color:var(--ink-3);\">{{ demo.foot }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"text-align:center; font-size:12px; color:rgba(255,255,255,0.42); margin-top:14px;\">Drei Wege zum Scrolly — klicken Sie sich durch<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"position:relative; border-top:1px solid rgba(255,255,255,0.12); padding:18px 0; overflow:hidden;\">\n      <div style=\"max-width:var(--wide); margin:0 auto; padding:0 24px 12px; font-size:10.4px; font-weight:700; letter-spacing:var(--cx-eyebrow-tracking); text-transform:uppercase; color:rgba(255,255,255,0.45);\">Scrolly ist kein Experiment — im Einsatz bei<\u002Fdiv>\n      <div style=\"display:flex; width:max-content; gap:56px; animation:cx-marquee 26s linear infinite; align-items:center;\">\n        <sc-for list=\"{{ marquee }}\" as=\"m\" hint-placeholder-count=\"8\">\n          <span style=\"{{ m.style }}\">{{ m.text }}<\u002Fspan>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section style=\"max-width:var(--wide); margin:0 auto; padding:var(--cx-space-24) 24px;\">\n    <div data-reveal=\"1\" style=\"display:grid; grid-template-columns:repeat(auto-fit,minmax(300px,1fr)); gap:44px 72px; align-items:end;\">\n      <h2 style=\"font-weight:700; font-size:clamp(34px,5vw,58px); line-height:1.02; letter-spacing:-0.035em;\">Ihr Bestandskunde will Rabatt. Ihr Wunschkunde antwortet nicht.<\u002Fh2>\n      <div style=\"display:grid; gap:0;\">\n        <div style=\"display:grid; grid-template-columns:8.5rem 1fr; gap:20px; align-items:start; padding:18px 0; border-top:1px solid var(--rule);\">\n          <div style=\"display:grid; gap:4px;\">\n            <span style=\"font-weight:700; font-size:38px; line-height:1; letter-spacing:-0.04em; color:var(--pink); white-space:nowrap;\">–20 %<\u002Fspan>\n            <span style=\"font-size:11px; font-weight:600; letter-spacing:0.14em; text-transform:uppercase; color:var(--ink-2);\">Verlängerung<\u002Fspan>\n          <\u002Fdiv>\n          <p style=\"font-size:16px; color:var(--ink-2); padding-top:4px;\">Jede Verlängerung geht über den Preis. Wer nichts Neues anbietet, gibt Nachlass.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"display:grid; grid-template-columns:8.5rem 1fr; gap:20px; align-items:start; padding:18px 0; border-top:1px solid var(--rule);\">\n          <div style=\"display:grid; gap:4px;\">\n            <span style=\"font-weight:700; font-size:38px; line-height:1; letter-spacing:-0.04em; color:var(--pink); white-space:nowrap;\">0<\u002Fspan>\n            <span style=\"font-size:11px; font-weight:600; letter-spacing:0.14em; text-transform:uppercase; color:var(--ink-2);\">Akquise<\u002Fspan>\n          <\u002Fdiv>\n          <p style=\"font-size:16px; color:var(--ink-2); padding-top:4px;\">Rückmeldungen auf die dritte Akquise-Mail. Es fehlt der Anlass für ein Gespräch.<\u002Fp>\n        <\u002Fdiv>\n        <p style=\"font-size:18px; font-weight:600; padding:18px 0 0; border-top:1px solid var(--rule);\">In beiden Fällen fehlt Ihrem Team nicht der Preis, sondern etwas Neues zum Zeigen. Genau dafür ist Scrolly da.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"produkt\" style=\"border-top:1px solid var(--rule);\">\n    <div style=\"max-width:var(--wide); margin:0 auto; padding:var(--cx-space-24) 24px;\">\n      <div data-reveal=\"1\" style=\"display:grid; grid-template-columns:repeat(auto-fit,minmax(300px,1fr)); gap:48px 72px; align-items:start; margin-bottom:64px;\">\n        <div>\n          <div style=\"font-size:10.4px; font-weight:700; letter-spacing:var(--cx-eyebrow-tracking); text-transform:uppercase; color:var(--ink-3); margin-bottom:16px;\">Das Produkt<\u002Fdiv>\n          <h2 style=\"font-size:clamp(30px,4.4vw,46px); font-weight:700; line-height:1.05; letter-spacing:-0.03em; margin-bottom:20px;\">Eine Geschichte, die sich beim Scrollen aufbaut.<\u002Fh2>\n          <p style=\"font-size:17px; color:var(--ink-2); max-width:44ch;\">Text, Bild und Animation kommen Schritt für Schritt — im Takt des Daumens. Kein überladener Bildschirm. Jeder Scroll wird sofort belohnt: Man bewegt den Finger, etwas verändert sich. Das hält die Aufmerksamkeit oben.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"display:grid; gap:0; align-content:start;\">\n          <div style=\"display:grid; grid-template-columns:1.6rem 1fr; gap:14px; padding:16px 0; border-top:1px solid var(--rule); font-size:16px;\">\n            <span style=\"color:var(--pink); font-weight:700;\">01<\u002Fspan>\n            <span>Läuft im Browser. Keine App, kein Download, mobile-first.<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"display:grid; grid-template-columns:1.6rem 1fr; gap:14px; padding:16px 0; border-top:1px solid var(--rule); font-size:16px;\">\n            <span style=\"color:var(--pink); font-weight:700;\">02<\u002Fspan>\n            <span>Eigener Link oder Embed-Code — CMS-unabhängig, auch auf der Seite des Kunden.<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"display:grid; grid-template-columns:1.6rem 1fr; gap:14px; padding:16px 0; border-top:1px solid var(--rule); font-size:16px;\">\n            <span style=\"color:var(--pink); font-weight:700;\">03<\u002Fspan>\n            <span>In Europa entwickelt, in Deutschland gehostet, DSGVO-konform.<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"padding:20px 0 0; border-top:1px solid var(--rule);\">\n            <a href=\"#galerie\" style=\"display:inline-flex; align-items:center; gap:10px; font-size:16px; font-weight:600;\">Drei echte Beispiele ansehen <span style=\"font-size:18px; line-height:1;\">→<\u002Fspan><\u002Fa>\n            <span style=\"display:block; font-size:13px; color:var(--ink-3); margin-top:6px;\">Veröffentlichte Scrollys, kein Account nötig.<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div data-reveal=\"1\">\n        <div style=\"font-size:10.4px; font-weight:700; letter-spacing:var(--cx-eyebrow-tracking); text-transform:uppercase; color:var(--ink-3); margin-bottom:24px;\">Belegte Wirkung<\u002Fdiv>\n        <div style=\"display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:0 40px;\">\n          <div style=\"border-top:2px solid var(--ink); padding:20px 0 24px;\">\n            <div style=\"font-weight:700; font-size:44px; line-height:1; letter-spacing:-0.04em; color:var(--pink); margin-bottom:8px;\">84 %<\u002Fdiv>\n            <div style=\"font-size:15px; font-weight:600; margin-bottom:8px;\">Lesen bis zum Ende<\u002Fdiv>\n            <p style=\"font-size:14px; color:var(--ink-2); margin-bottom:10px;\">Im Schnitt scrollen 84 % fast bis zum Schluss, statt nach der Hälfte abzuspringen.<\u002Fp>\n            <div style=\"font-size:12px; color:var(--ink-3);\">Branchenschnitt ~50 %<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"border-top:2px solid var(--ink); padding:20px 0 24px;\">\n            <div style=\"font-weight:700; font-size:44px; line-height:1; letter-spacing:-0.04em; color:var(--pink); margin-bottom:8px;\">1:17<\u002Fdiv>\n            <div style=\"font-size:15px; font-weight:600; margin-bottom:8px;\">Minuten Verweildauer<\u002Fdiv>\n            <p style=\"font-size:14px; color:var(--ink-2); margin-bottom:10px;\">Jeder Leser bleibt im Schnitt über eine Minute beim Inhalt.<\u002Fp>\n            <div style=\"font-size:12px; color:var(--ink-3);\">Branchenschnitt ~15 Sek.<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"border-top:2px solid var(--ink); padding:20px 0 24px;\">\n            <div style=\"font-weight:700; font-size:44px; line-height:1; letter-spacing:-0.04em; color:var(--pink); margin-bottom:8px;\">3–5×<\u002Fdiv>\n            <div style=\"font-size:15px; font-weight:600; margin-bottom:8px;\">Mehr Abschlüsse<\u002Fdiv>\n            <p style=\"font-size:14px; color:var(--ink-2); margin-bottom:10px;\">So viel mehr Leser klicken, kaufen oder melden sich an — weil sie bis zum Ende dabei waren.<\u002Fp>\n            <div style=\"font-size:12px; color:var(--ink-3);\">Das Argument gegenüber dem Anzeigenkunden<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"border-top:2px solid var(--ink); padding:20px 0 24px;\">\n            <div style=\"font-weight:700; font-size:44px; line-height:1; letter-spacing:-0.04em; color:var(--pink); margin-bottom:8px;\">+40 %<\u002Fdiv>\n            <div style=\"font-size:15px; font-weight:600; margin-bottom:8px;\">Häufiger geteilt<\u002Fdiv>\n            <p style=\"font-size:14px; color:var(--ink-2); margin-bottom:10px;\">Ein Scrolly wird 40 % öfter weiterempfohlen als ein normaler Beitrag.<\u002Fp>\n            <div style=\"font-size:12px; color:var(--ink-3);\">Reichweite ohne Mediabudget<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <p style=\"font-size:12px; color:var(--ink-3); margin-top:8px;\">Ø-Werte aus veröffentlichten Scrollys · Branchenvergleich aus öffentlichen Studien<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"galerie\" style=\"background:var(--paper-2); border-top:1px solid var(--rule);\">\n    <div style=\"max-width:var(--wide); margin:0 auto; padding:var(--cx-space-24) 24px;\">\n      <div data-reveal=\"1\" style=\"max-width:52ch; margin-bottom:40px;\">\n        <div style=\"font-size:10.4px; font-weight:700; letter-spacing:var(--cx-eyebrow-tracking); text-transform:uppercase; color:var(--ink-3); margin-bottom:16px;\">Live-Beispiele<\u002Fdiv>\n        <h2 style=\"font-size:clamp(30px,4.4vw,46px); font-weight:700; line-height:1.05; letter-spacing:-0.03em; margin-bottom:16px;\">Scrollen Sie selbst.<\u002Fh2>\n        <p style=\"font-size:17px; color:var(--ink-2);\">Echte, veröffentlichte Scrollys — heute schon bei GoodLife Magazin im Einsatz. Jeder öffnet sich in einem neuen Tab.<\u002Fp>\n      <\u002Fdiv>\n      <div data-reveal=\"1\" style=\"display:grid; grid-template-columns:repeat(auto-fit,minmax(250px,1fr)); gap:28px;\">\n        <a href=\"https:\u002F\u002Fview.scrolly.com\u002Fscrolly\u002Fe49e971f-1949-4c98-94d9-20de993db10c\" target=\"_blank\" rel=\"noopener\" style=\"color:var(--ink); display:flex; flex-direction:column; gap:14px;\">\n          <div style=\"aspect-ratio:4\u002F3; border-radius:var(--cx-radius-lg); overflow:hidden; background:var(--paper);\">\n            <img src=\"\u002Fimages\u002Fgoodlife-subzero.jpg\" alt=\"Mit Sub Zero wird Kühlen zum Ereignis\" loading=\"lazy\" style=\"width:100%; height:100%; object-fit:cover; display:block;\">\n          <\u002Fdiv>\n          <div style=\"display:flex; flex-direction:column; gap:6px;\">\n            <span style=\"font-size:10.4px; font-weight:700; letter-spacing:var(--cx-eyebrow-tracking); text-transform:uppercase; color:var(--ink-3);\">Branded Article &middot; GoodLife Magazin<\u002Fspan>\n            <span style=\"font-size:19px; font-weight:600; line-height:1.2; letter-spacing:-0.02em;\">Mit Sub Zero wird Kühlen zum Ereignis<\u002Fspan>\n            <span style=\"font-size:14px; color:var(--ink-2);\">Echte Anzeigenkunden-Kooperation: Der Küchenausstatter erzählt seine Geschichte im redaktionellen Umfeld.<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fa>\n        <a href=\"https:\u002F\u002Fview.scrolly.com\u002Fscrolly\u002Fa4fe67e4-c843-4617-9c8b-89466d8db94f\" target=\"_blank\" rel=\"noopener\" style=\"color:var(--ink); display:flex; flex-direction:column; gap:14px;\">\n          <div style=\"aspect-ratio:4\u002F3; border-radius:var(--cx-radius-lg); overflow:hidden; background:var(--paper);\">\n            <img src=\"\u002Fimages\u002Fgoodlife-jab-anstoetz.jpg\" alt=\"Neues Heim für Design\" loading=\"lazy\" style=\"width:100%; height:100%; object-fit:cover; display:block;\">\n          <\u002Fdiv>\n          <div style=\"display:flex; flex-direction:column; gap:6px;\">\n            <span style=\"font-size:10.4px; font-weight:700; letter-spacing:var(--cx-eyebrow-tracking); text-transform:uppercase; color:var(--ink-3);\">Store Opening &middot; GoodLife Magazin<\u002Fspan>\n            <span style=\"font-size:19px; font-weight:600; line-height:1.2; letter-spacing:-0.02em;\">Neues Heim für Design<\u002Fspan>\n            <span style=\"font-size:14px; color:var(--ink-2);\">JAB Anstoetz zeigt im neuen Hamburger Store die ganze Kreativ-Palette — der Umfeldplatz für Marken-Events.<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fa>\n        <a href=\"https:\u002F\u002Fview.scrolly.com\u002Fscrolly\u002Fa713dea6-0e61-42a9-9617-da2397005c23\" target=\"_blank\" rel=\"noopener\" style=\"color:var(--ink); display:flex; flex-direction:column; gap:14px;\">\n          <div style=\"aspect-ratio:4\u002F3; border-radius:var(--cx-radius-lg); overflow:hidden; background:var(--paper);\">\n            <img src=\"\u002Fimages\u002Fgoodlife-stil.jpg\" alt=\"Diese Accessoires sind der Natur verfallen\" loading=\"lazy\" style=\"width:100%; height:100%; object-fit:cover; display:block;\">\n          <\u002Fdiv>\n          <div style=\"display:flex; flex-direction:column; gap:6px;\">\n            <span style=\"font-size:10.4px; font-weight:700; letter-spacing:var(--cx-eyebrow-tracking); text-transform:uppercase; color:var(--ink-3);\">STIL &middot; GoodLife Magazin<\u002Fspan>\n            <span style=\"font-size:19px; font-weight:600; line-height:1.2; letter-spacing:-0.02em;\">Diese Accessoires sind der Natur verfallen<\u002Fspan>\n            <span style=\"font-size:14px; color:var(--ink-2);\">Redaktionelles Stil-Feature — zeigt, wie natürlich sich Scrolly ins Heftdesign einfügt.<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fa>\n      <\u002Fdiv>\n      <p data-reveal=\"1\" style=\"margin-top:26px; font-size:14px; color:var(--ink-3);\">Alle drei Beispiele sind live bei <a href=\"https:\u002F\u002Fgoodlife-magazin.de\" target=\"_blank\" rel=\"noopener\">goodlife-magazin.de<\u002Fa> veröffentlicht.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section style=\"background:var(--ink); color:#fff;\">\n    <div style=\"max-width:var(--wide); margin:0 auto; padding:var(--cx-space-24) 24px;\">\n      <div data-reveal=\"1\" style=\"max-width:52ch; margin-bottom:44px;\">\n        <div style=\"font-size:10.4px; font-weight:700; letter-spacing:var(--cx-eyebrow-tracking); text-transform:uppercase; color:rgba(255,255,255,0.45); margin-bottom:16px;\">Der Ablauf<\u002Fdiv>\n        <h2 style=\"font-size:clamp(30px,4.4vw,46px); font-weight:700; line-height:1.05; letter-spacing:-0.03em; margin-bottom:16px;\">Vom Kundenmaterial zum Reporting.<\u002Fh2>\n        <p style=\"font-size:17px; color:rgba(255,255,255,0.68);\">Egal, über welchen der drei Wege der Scrolly entsteht — danach läuft es immer gleich.<\u002Fp>\n      <\u002Fdiv>\n      <div data-reveal=\"1\" style=\"display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:20px;\">\n        <div style=\"border:1px solid rgba(255,255,255,0.14); border-radius:20px; padding:26px; display:flex; flex-direction:column; gap:12px;\">\n          <div style=\"font-size:10.4px; font-weight:700; letter-spacing:var(--cx-eyebrow-tracking); text-transform:uppercase; color:var(--pink);\">01 Anlegen<\u002Fdiv>\n          <div style=\"font-size:21px; font-weight:600; line-height:1.15; letter-spacing:-0.02em;\">Neuer Scrolly, Ihr Design.<\u002Fdiv>\n          <p style=\"font-size:15px; color:rgba(255,255,255,0.68);\">Logo, Farben und Schriften des Titels liegen im Brand Kit — sie sitzen von der ersten Sekunde an richtig.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"border:1px solid rgba(255,255,255,0.14); border-radius:20px; padding:26px; display:flex; flex-direction:column; gap:12px;\">\n          <div style=\"font-size:10.4px; font-weight:700; letter-spacing:var(--cx-eyebrow-tracking); text-transform:uppercase; color:var(--pink);\">02 Füllen<\u002Fdiv>\n          <div style=\"font-size:21px; font-weight:600; line-height:1.15; letter-spacing:-0.02em;\">Material des Kunden rein.<\u002Fdiv>\n          <p style=\"font-size:15px; color:rgba(255,255,255,0.68);\">Produktfotos und Logo hochladen, Text schreiben. Was fehlt, kommt aus 6 Mio. Bildern der Datenbank.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"border:1px solid rgba(255,255,255,0.14); border-radius:20px; padding:26px; display:flex; flex-direction:column; gap:12px;\">\n          <div style=\"font-size:10.4px; font-weight:700; letter-spacing:var(--cx-eyebrow-tracking); text-transform:uppercase; color:var(--pink);\">03 Ausspielen<\u002Fdiv>\n          <div style=\"font-size:21px; font-weight:600; line-height:1.15; letter-spacing:-0.02em;\">Link oder Embed.<\u002Fdiv>\n          <p style=\"font-size:15px; color:rgba(255,255,255,0.68);\">Eigener Link zum Verschicken oder Embed-Code für Ihr CMS — genauso für die Seite des Anzeigenkunden.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"border:1px solid rgba(255,255,255,0.14); border-radius:20px; padding:26px; display:flex; flex-direction:column; gap:12px;\">\n          <div style=\"font-size:10.4px; font-weight:700; letter-spacing:var(--cx-eyebrow-tracking); text-transform:uppercase; color:var(--pink);\">04 Auswerten<\u002Fdiv>\n          <div style=\"font-size:21px; font-weight:600; line-height:1.15; letter-spacing:-0.02em;\">Zahlen für den Kunden.<\u002Fdiv>\n          <p style=\"font-size:15px; color:rgba(255,255,255,0.68);\">Verweildauer, Scrolltiefe, Klicks. Das Reporting, das Sie nach jeder Printanzeige schuldig bleiben.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <p data-reveal=\"1\" style=\"margin-top:26px; border-top:1px solid rgba(255,255,255,0.14); padding-top:26px; font-size:15px; color:rgba(255,255,255,0.6);\">Mehrere Titel im Haus? Jeder bekommt seinen eigenen Bereich — mit eigenem Impressum, eigenen Rollen und Freigaben.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"szenarien\" style=\"background:var(--paper-2); border-top:1px solid var(--rule); border-bottom:1px solid var(--rule);\">\n    <div style=\"max-width:var(--wide); margin:0 auto; padding:var(--cx-space-24) 24px;\">\n      <div data-reveal=\"1\" style=\"margin-bottom:44px; max-width:52ch;\">\n        <div style=\"font-size:10.4px; font-weight:700; letter-spacing:var(--cx-eyebrow-tracking); text-transform:uppercase; color:var(--ink-3); margin-bottom:16px;\">Drei Einsatzszenarien<\u002Fdiv>\n        <h2 style=\"font-size:clamp(30px,4.4vw,46px); font-weight:700; line-height:1.05; letter-spacing:-0.03em; margin-bottom:16px;\">Vom ersten Kontakt zum festen Umsatzposten.<\u002Fh2>\n        <p style=\"font-size:17px; color:var(--ink-2);\">Im Scrolly steht die Geschichte Ihres Anzeigenkunden — gebaut vom Sales-Team, aus dessen eigenem Material. Die Redaktion muss nichts liefern.<\u002Fp>\n      <\u002Fdiv>\n\n      <div style=\"display:grid; grid-template-columns:repeat(auto-fit,minmax(300px,1fr)); gap:20px;\">\n        <sc-for list=\"{{ scenarios }}\" as=\"s\" hint-placeholder-count=\"3\">\n          <div data-reveal=\"1\" style=\"background:var(--paper); border:1px solid var(--rule); border-radius:16px; padding:28px; display:flex; flex-direction:column; gap:18px;\" style-hover=\"border-color:var(--pink)\">\n            <div style=\"display:flex; align-items:center; justify-content:space-between; gap:12px;\">\n              <span style=\"font-size:10.4px; font-weight:700; letter-spacing:var(--cx-eyebrow-tracking); text-transform:uppercase; color:var(--pink); white-space:nowrap;\">{{ s.kicker }}<\u002Fspan>\n              <span style=\"font-weight:600; font-size:20px; letter-spacing:-0.02em; color:var(--ink-3);\">{{ s.num }}<\u002Fspan>\n            <\u002Fdiv>\n            <h3 style=\"font-size:25px; font-weight:700; line-height:1.15; letter-spacing:-0.025em;\">{{ s.title }}<\u002Fh3>\n            <p style=\"font-size:15px; color:var(--ink-2);\">{{ s.body }}<\u002Fp>\n            <div style=\"background:var(--paper-2); border-radius:12px; padding:20px 22px; margin-top:auto;\">\n              <span style=\"font-size:10.5px; font-weight:700; letter-spacing:0.1em; text-transform:uppercase; color:var(--ink-3);\">{{ s.totalLabel }}<\u002Fspan>\n              <div style=\"font-weight:700; font-size:clamp(30px,3.8vw,38px); line-height:1.15; letter-spacing:-0.04em; color:var(--pink); margin:6px 0 10px;\">{{ s.total }}<\u002Fdiv>\n              <p style=\"font-size:13px; line-height:1.5; color:var(--ink-2);\">{{ s.summary }}<\u002Fp>\n            <\u002Fdiv>\n            <div style=\"font-size:11px; line-height:1.5; color:var(--ink-3);\">{{ s.note }}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section style=\"background:var(--pink); color:#fff;\">\n    <div style=\"max-width:var(--wide); margin:0 auto; padding:var(--cx-space-24) 24px; display:grid; grid-template-columns:repeat(auto-fit,minmax(280px,1fr)); gap:40px 72px; align-items:center;\">\n      <div data-reveal=\"1\">\n        <div style=\"font-size:10.4px; font-weight:700; letter-spacing:var(--cx-eyebrow-tracking); text-transform:uppercase; color:rgba(255,255,255,0.72); margin-bottom:16px;\">Echter Kunde, kein Rechenbeispiel<\u002Fdiv>\n        <div style=\"font-size:clamp(46px,7vw,88px); font-weight:700; line-height:0.98; letter-spacing:-0.04em;\">GoodLife<\u002Fdiv>\n        <div style=\"font-style:italic; font-weight:400; font-size:clamp(20px,2.6vw,28px); line-height:1.3; letter-spacing:-0.02em; color:rgba(255,255,255,0.9);\">Magazin<\u002Fdiv>\n      <\u002Fdiv>\n      <div data-reveal=\"1\" style=\"display:grid; gap:14px;\">\n        <p style=\"font-size:18px; line-height:1.55; color:#fff;\">GoodLife Magazin setzt Scrolly längst produktiv ein — redaktionell in der Rubrik STIL und als Anzeigenformat, etwa in Kooperation mit dem Küchenhersteller Sub Zero.<\u002Fp>\n        <p style=\"font-size:13px; line-height:1.55; color:rgba(255,255,255,0.68);\">Alle drei echten Beispiele oben (<a href=\"#galerie\" style=\"color:#fff; text-decoration:underline;\">Live-Beispiele<\u002Fa>) sind bei GoodLife live. Zahlenbeispiele auf dieser Seite sind gekennzeichnete Beispielrechnungen — keine Zusagen.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section style=\"max-width:var(--wide); margin:0 auto; padding:var(--cx-space-24) 24px;\">\n    <div data-reveal=\"1\" style=\"display:grid; grid-template-columns:repeat(auto-fit,minmax(280px,1fr)); gap:44px 72px;\">\n      <div>\n        <div style=\"font-size:10.4px; font-weight:700; letter-spacing:var(--cx-eyebrow-tracking); text-transform:uppercase; color:var(--ink-3); margin-bottom:16px;\">Der Einstieg<\u002Fdiv>\n        <h2 style=\"font-size:clamp(30px,4.2vw,46px); font-weight:700; line-height:1.05; letter-spacing:-0.03em; margin-bottom:16px;\">Kein Projekt. Eine Person.<\u002Fh2>\n        <p style=\"font-size:17px; color:var(--ink-2);\">Sie brauchen keinen Rollout und keine Schulungswoche. Ein Zugang, eine Person im Team — oft genügt ein Werkstudent. Der erste Scrolly steht am selben Tag.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"display:grid; gap:1px; background:var(--rule); border:1px solid var(--rule); border-radius:14px; overflow:hidden; align-content:start;\">\n        <sc-for list=\"{{ simple }}\" as=\"row\" hint-placeholder-count=\"4\">\n          <div style=\"background:var(--paper); padding:18px 22px; display:flex; gap:14px; align-items:baseline;\">\n            <span style=\"color:var(--pink); font-size:13px; font-weight:700;\">✓<\u002Fspan>\n            <span style=\"font-size:15.5px; font-weight:500;\">{{ row.text }}<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"termin\" style=\"background:var(--ink); color:#fff;\">\n    <div style=\"max-width:var(--wide); margin:0 auto; padding:var(--cx-space-24) 24px; display:grid; grid-template-columns:repeat(auto-fit,minmax(300px,1fr)); gap:48px 72px; align-items:start;\">\n      <div>\n        <div style=\"font-size:10.4px; font-weight:700; letter-spacing:var(--cx-eyebrow-tracking); text-transform:uppercase; color:var(--pink); margin-bottom:16px;\">Termin<\u002Fdiv>\n        <h2 style=\"font-size:clamp(32px,4.8vw,54px); font-weight:700; line-height:1.02; letter-spacing:-0.035em; margin-bottom:20px;\">15 Minuten Videocall.<br>Einer Ihrer Kunden.<br><span style=\"color:var(--pink);\">Ein fertiger Scrolly.<\u002Fspan><\u002Fh2>\n        <p style=\"font-size:17px; color:rgba(255,255,255,0.72); margin-bottom:10px;\">Nennen Sie uns einen Anzeigenkunden. Wir bauen im Call einen Scrolly über sein Produkt — Sie sehen live, wie lange das dauert. Danach entscheiden Sie.<\u002Fp>\n        <p style=\"font-size:14px; color:rgba(255,255,255,0.45);\">Kein Vertrag, keine Präsentation. Wir antworten innerhalb eines Werktags mit zwei Terminvorschlägen.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"background:var(--ink-soft); border:1px solid rgba(255,255,255,0.14); border-radius:18px; padding:30px;\">\n        <sc-if value=\"{{ sent }}\" hint-placeholder-val=\"{{ false }}\">\n          <div>\n            <div style=\"font-size:28px; font-weight:700; letter-spacing:-0.03em; margin-bottom:12px;\">Danke — notiert.<\u002Fdiv>\n            <p style=\"font-size:15px; color:rgba(255,255,255,0.7);\">Wir schreiben an <strong style=\"color:#fff;\">{{ email }}<\u002Fstrong> und schlagen zwei Termine vor.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ notSent }}\" hint-placeholder-val=\"{{ true }}\">\n          <form sc-camel-on-submit=\"{{ submit }}\" style=\"display:grid; gap:16px;\">\n            <label style=\"display:grid; gap:7px;\">\n              <span style=\"font-size:10.4px; font-weight:700; letter-spacing:var(--cx-eyebrow-tracking); text-transform:uppercase; color:rgba(255,255,255,0.55);\">E-Mail<\u002Fspan>\n              <input type=\"email\" required=\"required\" placeholder=\"name@verlag.de\" value=\"{{ email }}\" sc-camel-on-change=\"{{ onEmail }}\" style=\"width:100%; padding:14px; font-size:15px; color:#fff; background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.16); border-radius:var(--cx-radius-md); outline:none;\" style-focus=\"border-color:var(--pink)\">\n            <\u002Flabel>\n            <label style=\"display:grid; gap:7px;\">\n              <span style=\"font-size:10.4px; font-weight:700; letter-spacing:var(--cx-eyebrow-tracking); text-transform:uppercase; color:rgba(255,255,255,0.55);\">Verlag<\u002Fspan>\n              <input type=\"text\" placeholder=\"Optional\" style=\"width:100%; padding:14px; font-size:15px; color:#fff; background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.16); border-radius:var(--cx-radius-md); outline:none;\" style-focus=\"border-color:var(--pink)\">\n            <\u002Flabel>\n            <input type=\"text\" name=\"website\" tabindex=\"-1\" autocomplete=\"off\" style=\"position:absolute; left:-9999px; width:1px; height:1px; opacity:0;\" aria-hidden=\"true\">\n            <div style=\"display:grid; gap:9px;\">\n              <span style=\"font-size:10.4px; font-weight:700; letter-spacing:var(--cx-eyebrow-tracking); text-transform:uppercase; color:rgba(255,255,255,0.55);\">Wann passt es?<\u002Fspan>\n              <div style=\"display:flex; flex-wrap:wrap; gap:8px;\">\n                <sc-for list=\"{{ slots }}\" as=\"slot\" hint-placeholder-count=\"3\">\n                  <button type=\"button\" sc-camel-on-click=\"{{ slot.pick }}\" style=\"{{ slot.style }}\">{{ slot.label }}<\u002Fbutton>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <button type=\"submit\" style=\"margin-top:4px; background:var(--pink); color:#fff; font-family:inherit; font-size:16px; font-weight:600; border:0; padding:16px 22px; border-radius:var(--cx-radius-pill); cursor:pointer;\" style-hover=\"opacity:0.9\">Termin anfragen<\u002Fbutton>\n            <div style=\"font-size:12px; color:rgba(255,255,255,0.42);\">Nur zur Terminabstimmung. Kein Newsletter.<\u002Fdiv>\n          <\u002Fform>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <footer style=\"background:var(--ink); border-top:1px solid rgba(255,255,255,0.12); color:rgba(255,255,255,0.5);\">\n    <div style=\"max-width:var(--wide); margin:0 auto; padding:28px 24px 32px; display:flex; flex-wrap:wrap; gap:14px 32px; justify-content:space-between; align-items:flex-end;\">\n      <div style=\"display:flex; flex-direction:column; gap:14px; font-size:13px; max-width:56ch;\">\n        <div>Scrolly wird von ppi media mitentwickelt und umgesetzt. Ihr Key Account Manager begleitet Einführung und die ersten Scrollys.<\u002Fdiv>\n        <div style=\"display:flex; gap:20px; font-size:12.5px;\">\n          <a href=\"\u002Fimpressum.html\" style=\"color:rgba(255,255,255,0.55);\">Impressum<\u002Fa>\n          <a href=\"\u002Fdatenschutz.html\" style=\"color:rgba(255,255,255,0.55);\">Datenschutz<\u002Fa>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex; flex-direction:column; gap:0px; align-items:flex-start; line-height:1.25;\">\n      <span style=\"font-size:16px; font-weight:600; color:#fff; white-space:nowrap;\">ppi media holding<\u002Fspan>\n      <span style=\"font-size:16px; font-weight:600; color:#fff; white-space:nowrap;\">ppi media<\u002Fspan>\n      <span style=\"font-size:16px; font-weight:600; color:#fff; white-space:nowrap;\">ppi fusion<\u002Fspan>\n      <span style=\"font-size:16px; font-weight:600; color:#fff; white-space:nowrap;\">ppi n3xt<\u002Fspan>\n      <span style=\"font-size:16px; font-weight:600; color:#fff; white-space:nowrap;\">ppi talk<\u002Fspan>\n      <span style=\"font-size:16px; font-weight:600; color:#fff; white-space:nowrap;\">alphabeta neo<\u002Fspan>\n    <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Ffooter>\n\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{\n  &quot;accentColor&quot;: { &quot;editor&quot;: &quot;color&quot;, &quot;default&quot;: &quot;#ff0f6e&quot;, &quot;tsType&quot;: &quot;string&quot;, &quot;options&quot;: [&quot;#ff0f6e&quot;, &quot;#e5006e&quot;, &quot;#ff4d2e&quot;, &quot;#075df2&quot;], &quot;section&quot;: &quot;Stil&quot; },\n  &quot;darkMode&quot;: { &quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: false, &quot;tsType&quot;: &quot;boolean&quot;, &quot;section&quot;: &quot;Stil&quot; },\n  &quot;scrollReveal&quot;: { &quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: true, &quot;tsType&quot;: &quot;boolean&quot;, &quot;section&quot;: &quot;Verhalten&quot; },\n  &quot;jahrespreis&quot;: { &quot;editor&quot;: &quot;int&quot;, &quot;default&quot;: 3000, &quot;min&quot;: 1000, &quot;max&quot;: 12000, &quot;step&quot;: 250, &quot;unit&quot;: &quot;€&quot;, &quot;tsType&quot;: &quot;number&quot;, &quot;section&quot;: &quot;Inhalt&quot; }\n}\">\nclass Component extends DCLogic {\n  state = { email: \"\", sent: false, slot: null, step: 0 };\n\n  componentDidMount() { this.applyTheme(); this.setupReveal(); this.setupCount(); }\n  componentDidUpdate() { this.applyTheme(); }\n\n  applyTheme() {\n    const r = document.documentElement.style;\n    r.setProperty(\"--pink\", this.props.accentColor ?? \"#ff0f6e\");\n    const dark = this.props.darkMode === true;\n    if (dark) {\n      r.setProperty(\"--paper\", \"#17121b\"); r.setProperty(\"--paper-2\", \"#201926\");\n      r.setProperty(\"--rule\", \"#332a3a\"); r.setProperty(\"--ink\", \"#f5f1ee\");\n      r.setProperty(\"--ink-2\", \"#bdb2b8\"); r.setProperty(\"--ink-3\", \"#8d8288\");\n    } else {\n      r.setProperty(\"--paper\", \"#f7f4ef\"); r.setProperty(\"--paper-2\", \"#efe9e0\");\n      r.setProperty(\"--rule\", \"#ddd4c8\"); r.setProperty(\"--ink\", \"#100c14\");\n      r.setProperty(\"--ink-2\", \"#544b53\"); r.setProperty(\"--ink-3\", \"#8d8288\");\n    }\n  }\n\n  setupReveal() {\n    if (this.props.scrollReveal === false) return;\n    const io = new IntersectionObserver((entries) => {\n      entries.forEach((e) => {\n        if (!e.isIntersecting) return;\n        e.target.style.opacity = \"1\";\n        e.target.style.transform = \"none\";\n        io.unobserve(e.target);\n      });\n    }, { threshold: 0.1, rootMargin: \"0px 0px -6% 0px\" });\n    Array.from(document.querySelectorAll(\"[data-reveal]\")).forEach((el, i) => {\n      if (el.getBoundingClientRect().top < window.innerHeight * 0.85) return;\n      el.style.opacity = \"0\";\n      el.style.transform = \"translateY(22px)\";\n      el.style.transition = \"opacity 650ms ease-out \" + (i % 3) * 70 + \"ms, transform 700ms cubic-bezier(0.2,0.7,0.2,1) \" + (i % 3) * 70 + \"ms\";\n      io.observe(el);\n    });\n  }\n\n  setupCount() {\n    const el = document.querySelector(\"[data-count]\");\n    if (!el) return;\n    const target = Number(el.getAttribute(\"data-count\"));\n    const io = new IntersectionObserver((entries) => {\n      if (!entries[0].isIntersecting) return;\n      io.disconnect();\n      const t0 = performance.now(), dur = 1100;\n      const tick = (t) => {\n        const p = Math.min(1, (t - t0) / dur);\n        const eased = 1 - Math.pow(1 - p, 3);\n        el.textContent = Math.round(target * eased).toLocaleString(\"de-DE\") + \" €\";\n        if (p < 1) requestAnimationFrame(tick);\n      };\n      requestAnimationFrame(tick);\n    }, { threshold: 0.4 });\n    io.observe(el);\n  }\n\n  renderVals() {\n    const price = this.props.jahrespreis ?? 3000;\n    const fmt = (n) => n.toLocaleString(\"de-DE\") + \" €\";\n    const step = this.state.step;\n\n    const chip = (active) => [\n      \"font-family:inherit\", \"font-size:12px\", \"font-weight:600\", \"cursor:pointer\",\n      \"padding:9px 13px\", \"border-radius:9999px\", \"flex:1\", \"transition:150ms ease-out\",\n      active\n        ? \"background:var(--pink); color:#fff; border:1px solid var(--pink)\"\n        : \"background:transparent; color:rgba(255,255,255,0.62); border:1px solid rgba(255,255,255,0.18)\"\n    ].join(\";\");\n\n    const demos = [\n      {\n        kicker: \"Weg 1 von 3\",\n        title: \"Layout wählen, Inhalte einsetzen\",\n        rows: [\n          { text: \"Über 40 fertige Layouts\", muted: false },\n          { text: \"Dramaturgie ist vorgegeben\", muted: false },\n          { text: \"Bilder hochladen, Text schreiben\", muted: true }\n        ],\n        foot: \"Unter 3 Minuten bis zum fertigen Link.\"\n      },\n      {\n        kicker: \"Weg 2 von 3\",\n        title: \"Einen Satz beschreiben\",\n        rows: [\n          { text: \"Die KI schreibt den Text\", muted: false },\n          { text: \"Die KI setzt Dramaturgie und Übergänge\", muted: false },\n          { text: \"Sie verfeinern, was Sie wollen\", muted: true }\n        ],\n        foot: \"Der Erstentwurf, bevor der Kunde gebrieft hat.\"\n      },\n      {\n        kicker: \"Weg 3 von 3\",\n        title: \"Jeden Pixel selbst setzen\",\n        rows: [\n          { text: \"Layer und Keyframes\", muted: false },\n          { text: \"Animationstiming frei bestimmen\", muted: false },\n          { text: \"Keine Zeile Code\", muted: true }\n        ],\n        foot: \"Für Sonderveröffentlichungen. Ab August 2026.\"\n      }\n    ];\n    const d = demos[step];\n\n    return {\n      steps: [\"Template\", \"KI-Studio\", \"Pro Editor\"].map((tab, i) => ({\n        tab, tabStyle: chip(i === step), pick: () => this.setState({ step: i })\n      })),\n      progressStyle: \"height:100%; background:var(--pink); width:33.333%; transition:transform 400ms ease-out; transform:translateX(\" + (step * 100) + \"%)\",\n      demo: {\n        kicker: d.kicker, title: d.title, foot: d.foot,\n        rows: d.rows.map((r) => ({\n          text: r.text,\n          style: \"font-size:14px; padding:11px 13px; border-radius:8px; background:var(--paper-2); color:\" + (r.muted ? \"var(--ink-3)\" : \"var(--ink)\") + \"; font-weight:\" + (r.muted ? \"400\" : \"500\")\n        }))\n      },\n      marquee: [\"DIE ZEIT\", \"WirtschaftsWoche\", \"stern\", \"AOK\", \"Borussia Dortmund\", \"HORNBACH\", \"DIE ZEIT\", \"WirtschaftsWoche\", \"stern\", \"AOK\", \"Borussia Dortmund\", \"HORNBACH\"].map((text, i) => ({\n        text,\n        style: \"font-weight:600; font-size:19px; letter-spacing:-0.02em; color:rgba(255,255,255,\" + (i % 3 === 1 ? \"0.9\" : \"0.55\") + \"); white-space:nowrap;\"\n      })),\n      email: this.state.email,\n      sent: this.state.sent,\n      notSent: !this.state.sent,\n      onEmail: (e) => this.setState({ email: e.target.value }),\n      submit: (e) => { e.preventDefault(); var companyInput = e.target.querySelector('input[type=text]'); var honeypot = e.target.querySelector('input[name=website]'); if (window.ScrollyLeadCapture) { window.ScrollyLeadCapture.submitLead({ email: this.state.email, company: companyInput ? companyInput.value : '', slot: this.state.slot || '', source: 'termin-form', website: honeypot ? honeypot.value : '' }); } this.setState({ sent: true }); },\n      slots: [\"Diese Woche\", \"Nächste Woche\", \"Schlagen Sie vor\"].map((label) => ({\n        label,\n        pick: () => this.setState({ slot: label }),\n        style: [\n          \"font-family:inherit\", \"font-size:13px\", \"font-weight:500\", \"cursor:pointer\",\n          \"padding:9px 15px\", \"border-radius:9999px\", \"transition:150ms ease-out\",\n          this.state.slot === label\n            ? \"background:#fff; color:var(--ink); border:1px solid #fff\"\n            : \"background:transparent; color:rgba(255,255,255,0.65); border:1px solid rgba(255,255,255,0.2)\"\n        ].join(\";\")\n      })),\n      simple: [\n        { text: \"Einfacher zu bedienen als PowerPoint\" },\n        { text: \"In Minuten einsatzbereit, kein IT-Projekt\" },\n        { text: \"Fotos und Text rein, fertige Story raus\" },\n        { text: \"Beliebig viele Scrollys im Jahrespreis\" }\n      ],\n      scenarios: [\n        {\n          num: \"01\", kicker: \"Türöffner\",\n          title: \"Schenken statt anschreiben.\",\n          body: \"Statt der vierten Akquise-Mail bekommt der Wunschkunde einen fertigen Scrolly über sein eigenes Produkt — gebaut aus dem, was auf seiner Website steht. Geschenk, kein Angebot.\",\n          summary: \"0 € Material, 0 € Produktion, 15 Minuten Aufwand — bei \" + fmt(price) + \" Jahreskosten.\",\n          totalLabel: \"Rechnet sich ab\", total: \"1 Neukunde\",\n          note: \"Beispielrechnung: Ein einziger gewonnener Neukunde deckt die Jahreskosten in der Regel mehrfach.\"\n        },\n        {\n          num: \"02\", kicker: \"Kaufbeschleuniger\",\n          title: \"Scrolly statt Rabatt.\",\n          body: \"Der Kunde zögert bei einer Print-Buchung über 12.000 € und will 20 % Nachlass. Ihr Verkäufer senkt den Preis nicht, sondern legt einen Scrolly kostenlos dazu.\",\n          summary: \"12.000 € Buchung, 20 % Rabattwunsch (− 2.400 €) — der Scrolly kostet 15 Minuten und 0 €.\",\n          totalLabel: \"Marge gesichert\", total: \"2.400 €\",\n          note: \"Beispielrechnung mit angenommener Buchungshöhe und üblichem Rabattwunsch.\"\n        },\n        {\n          num: \"03\", kicker: \"Eigenes Format\",\n          title: \"Scrolly als buchbares Produkt.\",\n          body: \"Sie nehmen Scrolly mit festem Preis in Ihre Mediadaten auf, wie Anzeige oder Beilage. Produziert wird es von Ihrem Sales-Team, nicht von der Redaktion.\",\n          summary: \"3.500 € pro Buchung, 2 Buchungen im Monat — abzüglich \" + fmt(price) + \" Jahreskosten.\",\n          totalLabel: \"Zusatzumsatz pro Jahr\", total: \"84.000 €\",\n          note: \"Beispielrechnung bei 2 Buchungen im Monat und 3.500 € Listenpreis. Keine Zusage.\"\n        }\n      ]\n    };\n  }\n}\n\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
